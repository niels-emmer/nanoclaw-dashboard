services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      NANOCLAW_ROOT: ${NANOCLAW_CONTAINER_DATA:-/nanoclaw}
      NANOCLAW_BACKUP_DIR: /backups
    volumes:
      - ${NANOCLAW_HOST_DATA:-../nanoclaw}:${NANOCLAW_CONTAINER_DATA:-/nanoclaw}:ro
      # Writable backup folder inside the dashboard repo (never the nanoclaw data).
      - ${BACKUP_DIR:-./backups}:/backups
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-}
        VITE_BACKUP_TOKEN: ${VITE_BACKUP_TOKEN:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    restart: unless-stopped
