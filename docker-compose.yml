services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      NANOCLAW_ROOT: ${NANOCLAW_CONTAINER_DATA:-/nanoclaw}
    volumes:
      - ${NANOCLAW_HOST_DATA:-../nanoclaw}:${NANOCLAW_CONTAINER_DATA:-/nanoclaw}:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    restart: unless-stopped
