version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_BACKEND_WS_URL: ${VITE_BACKEND_WS_URL:-}
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-4173}:80"
    restart: unless-stopped
