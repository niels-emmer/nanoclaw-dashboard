server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self';
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
        font-src 'self' https://fonts.gstatic.com;
        img-src 'self' data:;
        connect-src 'self' ws: wss:;
        frame-ancestors 'none';
        base-uri 'self';
        form-action 'self';
    " always;

    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/config/ {
        proxy_pass http://backend:8000/api/config/;
        proxy_set_header Host $host;
    }

    # Exact match for the collection endpoints (POST /api/backup, GET /api/backup)
    # — the frontend calls them without a trailing slash, which the prefix
    # location below would not match (causing a 301 + POST→GET conversion).
    location = /api/backup {
        proxy_pass http://backend:8000/api/backup;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/backup/ {
        proxy_pass http://backend:8000/api/backup/;
        proxy_set_header Host $host;
        # Backup creation is synchronous and can take minutes for full-system
        # backups (conversation history + compression). The nginx default
        # proxy_read_timeout is 60s, which would kill long-running requests.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
