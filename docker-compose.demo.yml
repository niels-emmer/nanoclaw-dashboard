# Demo instance override.
#
# Run with:
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up --build -d
#
# Requires Docker Compose v2.24+ (the `!override` YAML tag).
#
# Exposes ONLY the frontend on the external proxy network (reverse-proxy
# ingress). No host ports are published; the backend is reachable only from
# the frontend container over the internal network. The backend runs the demo
# mock profile (multi-tier agent network with a human-facing concierge agent),
# so no nanoclaw host or data mount is needed.
#
# `!override` replaces the base compose's port mappings and volumes entirely
# (Compose concatenates multi-value options by default, so `ports: []` alone
# would not remove the published ports).
#
# Host-specific values (VPS address, folder, reverse-proxy network name) are
# NOT in this file — they belong in the gitignored .env on the host.
services:
  backend:
    ports: !override []
    networks:
      - internal
    environment:
      NANOCLAW_MOCK_PROFILE: demo
      NANOCLAW_ENABLED: "false"
    volumes: !override
      - ${BACKUP_DIR:-./backups}:/backups

  frontend:
    build:
      args:
        # Force these empty so no host value (e.g. a production backup token
        # or WS URL from a copied .env) is baked into the public demo bundle.
        VITE_BACKUP_TOKEN: ""
        VITE_BACKEND_WS_URL: ""
    ports: !override []
    networks:
      - internal
      - proxy

networks:
  internal:
  proxy:
    name: ${NANOCLAW_PROXY_NETWORK:?set NANOCLAW_PROXY_NETWORK in the gitignored .env}
    external: true