name: Release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe6059398bd2b10e8f9e2e2b6af4b1b2b3c3f # v2.2.1
        with:
          generate_release_notes: false
          body: "See [CHANGELOG](CHANGELOG.md) for full details."
