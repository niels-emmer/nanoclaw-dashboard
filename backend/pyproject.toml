[project]
name = "nanoclaw-backend"
version = "0.1.0"
description = "FastAPI backend streaming nanoclaw orchestrator telemetry"
readme = "../README.md"
requires-python = ">=3.11"
authors = [{name = "Nanoclaw Ops"}]
dependencies = [
    "fastapi==0.140.6",
    "uvicorn[standard]==0.51.0",
    "pydantic-settings==2.14.2",
    "orjson==3.11.9",
    "structlog==26.1.0",
    "python-dotenv==1.2.2"
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-asyncio==1.4.0"
]

[project.scripts]
nanoclaw-backend = "app.cli:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
