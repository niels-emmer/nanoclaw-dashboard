[project]
name = "nanoclaw-backend"
version = "0.1.0"
description = "FastAPI backend streaming nanoclaw orchestrator telemetry"
readme = "../README.md"
requires-python = ">=3.11"
authors = [{name = "Nanoclaw Ops"}]
dependencies = [
    "fastapi==0.112.0",
    "uvicorn[standard]==0.30.3",
    "pydantic-settings==2.4.0",
    "orjson==3.10.7",
    "structlog==24.2.0",
    "python-dotenv==1.0.1"
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "httpx==0.28.1",
    "pytest-asyncio==0.23.7"
]

[project.scripts]
nanoclaw-backend = "app.cli:main"

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
